# Production deploy: manual only, from main, behind the protected `production` environment (owner approval, AGENTS
# approval gate). Deploys the commit the operator names after verifying it is on main and CI passed for it.
name: deploy-production
on:
  workflow_dispatch:
    inputs:
      sha:
        description: Full commit SHA on main that passed CI and staging
        required: true
        type: string
permissions: {}
concurrency:
  group: deploy-production
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - name: Commit is on main and CI passed for it
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ inputs.sha }}
          REPO: ${{ github.repository }}
        run: |
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "sha must be a full 40-char commit"; exit 1; }
          gh api "repos/$REPO/compare/main...$SHA" --jq '.status' | grep -Eq '^(identical|behind)$' || { echo "commit is not on main"; exit 1; }
          gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$SHA&status=success" --jq '.total_count' | grep -qv '^0$' || { echo "no green CI run for this commit"; exit 1; }
  deploy:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm security:bundle-audit
      - name: Apply D1 control migrations (production)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler d1 migrations apply DB --remote --env production
      - name: Deploy Worker (production)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy --env production
      - name: Migrate tenant objects (production)
        env:
          GX_OPS_TOKEN: ${{ secrets.GX_OPS_TOKEN }}
        run: pnpm do:migrate --env production
      - name: Probes (production)
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: pnpm probes --env production
